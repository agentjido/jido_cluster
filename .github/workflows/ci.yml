name: V3 Foundation CI

on:
  pull_request:
  push:
    branches: [main, v3-spike]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "27"
            elixir: "1.18"
          - otp: "28"
            elixir: "1.19"
    steps:
      - uses: actions/checkout@v4
        with:
          path: jido_cluster
      - uses: actions/checkout@v4
        with:
          repository: agentjido/jido
          ref: release/v3
          path: jido
      - uses: actions/checkout@v4
        with:
          repository: agentjido/jido_action
          ref: release/v3
          path: jido_action
      - uses: actions/checkout@v4
        with:
          repository: agentjido/jido_signal
          ref: release/v3
          path: jido_signal
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: Install dependencies
        working-directory: jido_cluster
        run: |
          mix deps.get
          MIX_ENV=test mix deps.get
      - name: Check code quality
        working-directory: jido_cluster
        run: mix quality
      - name: Check format and compile
        working-directory: jido_cluster
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      - name: Run unit tests
        working-directory: jido_cluster
        run: mix test --seed 0
      - name: Run local node tests
        working-directory: jido_cluster
        run: mix test.peer
      - name: Run example tests
        working-directory: jido_cluster
        run: mix test.examples
